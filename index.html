<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Pulso</title>
    <!-- viewport-fit=cover: la app usa toda la pantalla y respeta las áreas seguras (notch, barra de inicio) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Hábitos saludables en menos de 30 segundos por día." />
    <!-- Color de la barra del navegador; utils/theme.js lo sincroniza con el tema -->
    <meta name="theme-color" content="#0f0f0f" />
    <!-- Google Fonts: Geist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css" />
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script>
</head>

<body>
    <a class="skip-link" href="#view">Saltar al contenido</a>

    <!-- LAYOUT: Grid-Layout (tecla "g") -->
    <div class="grid-layout hidden" aria-hidden="true">
        <div class="grid-inner"></div>
    </div>

    <div class="app-shell">
        <!-- LAYOUT: Header -->
        <header class="app-header">
            <div class="app-header__inner container">
                <div class="app-header__lead">
                    <a class="btn btn--icon app-header__back" href="#/perfil" data-header-back hidden
                        aria-label="Volver">
                        <!-- Lucide: chevron-left -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                    </a>
                    <div class="app-header__titles">
                        <h1 class="app-header__title" data-header-title tabindex="-1">Pulso</h1>
                        <p class="app-header__subtitle" data-header-subtitle></p>
                    </div>
                </div>
                <a class="avatar" href="#/perfil" data-route="perfil" aria-label="Perfil y ajustes">
                    <span data-avatar-initial hidden></span>
                    <!-- Lucide: user -->
                    <svg data-avatar-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </a>
            </div>
        </header>

        <!-- LAYOUT: View (el router monta acá cada sección) -->
        <main id="view" class="app-view" tabindex="-1"></main>

        <!-- LAYOUT: Bottom-Nav (Hoy al centro, elevado; riel lateral en desktop) -->
        <nav class="bottom-nav" aria-label="Secciones">
            <a class="bottom-nav__brand" href="#/hoy">
                <span class="status-pulse status-pulse--live" aria-hidden="true"></span>
                Pulso
            </a>
            <ul class="bottom-nav__list">
                <li>
                    <a class="bottom-nav__link" href="#/moverse" data-route="moverse">
                        <!-- Lucide: footprints -->
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path
                                d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" />
                            <path
                                d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" />
                            <path d="M16 17h4" />
                            <path d="M4 13h4" />
                        </svg>
                        <span class="bottom-nav__label">Moverse</span>
                    </a>
                </li>
                <li>
                    <a class="bottom-nav__link" href="#/comer" data-route="comer">
                        <!-- Lucide: apple -->
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 6.528V3a1 1 0 0 1 1-1h0" />
                            <path
                                d="M18.237 21A15 15 0 0 0 22 11a6 6 0 0 0-10-4.472A6 6 0 0 0 2 11a15.1 15.1 0 0 0 3.763 10 3 3 0 0 0 3.648.648 5.5 5.5 0 0 1 5.178 0A3 3 0 0 0 18.237 21" />
                        </svg>
                        <span class="bottom-nav__label">Comer</span>
                    </a>
                </li>
                <li>
                    <!-- Hoy: botón central elevado -->
                    <a class="bottom-nav__link bottom-nav__link--main" href="#/hoy" data-route="hoy">
                        <span class="bottom-nav__fab">
                            <!-- Lucide: sun -->
                            <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="4" />
                                <path d="M12 2v2" />
                                <path d="M12 20v2" />
                                <path d="m4.93 4.93 1.41 1.41" />
                                <path d="m17.66 17.66 1.41 1.41" />
                                <path d="M2 12h2" />
                                <path d="M20 12h2" />
                                <path d="m6.34 17.66-1.41 1.41" />
                                <path d="m19.07 4.93-1.41 1.41" />
                            </svg>
                        </span>
                        <span class="bottom-nav__label">Hoy</span>
                    </a>
                </li>
                <li>
                    <a class="bottom-nav__link" href="#/descanso" data-route="descanso">
                        <!-- Lucide: moon -->
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path
                                d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
                        </svg>
                        <span class="bottom-nav__label">Descanso</span>
                    </a>
                </li>
                <li>
                    <a class="bottom-nav__link" href="#/progreso" data-route="progreso">
                        <!-- Lucide: trending-up -->
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 7h6v6" />
                            <path d="m22 7-8.5 8.5-5-5L2 17" />
                        </svg>
                        <span class="bottom-nav__label">Progreso</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Avisos breves (components/toast) -->
    <div class="toast-region" data-toast-region aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
